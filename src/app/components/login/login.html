<div class="login-page">
    <div class="login-card">

        <div class="login-header">
            <div class="login-logo">UGPA</div>
            <h1>Unidad de Gestión de Procesos Académicos</h1>
            <p>Ingresa con tu correo institucional</p>
        </div>

        <form class="login-form" (ngSubmit)="ingresar()">

            <div class="campo">
                <label for="correo">Correo institucional</label>
                <input id="correo" type="email" name="correo" [(ngModel)]="correo"
                    placeholder="nombre.apellido@institucion.edu.ec" autocomplete="email" [disabled]="cargando"
                    required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <div class="input-password">
                    <input [type]="mostrarContrasena ? 'text' : 'password'" id="contrasena" name="contrasena"
                        [(ngModel)]="contrasena" placeholder="••••••••" autocomplete="current-password"
                        [disabled]="cargando" required>
                    <button type="button" class="btn-ojo" (click)="mostrarContrasena = !mostrarContrasena"
                        tabindex="-1">
                        <svg *ngIf="!mostrarContrasena" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg *ngIf="mostrarContrasena" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.7 18.7 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.7 18.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mensaje-error" *ngIf="error">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                {{ error }}
            </div>

            <div class="mensaje-exito" *ngIf="mensajeExito">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                {{ mensajeExito }}
            </div>
            <div class="mensaje-pendiente" *ngIf="mensajePendiente">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                {{ mensajePendiente }}
            </div>
            <button type="submit" class="btn-ingresar" [disabled]="cargando">
                <div class="spinner-sm" *ngIf="cargando"></div>
                {{ cargando ? 'Verificando...' : 'Ingresar' }}
            </button>

            <p class="nota-primera-vez">
                ¿Primera vez? Solo ingresa tu correo y crea una contraseña — tu cuenta se registrará automáticamente.
            </p>

        </form>

    </div>
</div>
